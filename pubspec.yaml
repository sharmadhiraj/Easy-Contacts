name: easy_contacts
description: "A simple, offline contact manager built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^8.2.0
  fluttertoast: ^10.0.2
  uuid: ^4.5.1
  go_router: ^18.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0

flutter:
  uses-material-design: true
